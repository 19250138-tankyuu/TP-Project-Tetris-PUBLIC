<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シンプル テトリス</title>
<style>
body {
background-image: url("探求背景.jpeg");
background-size: cover;
background-position: center;
background-attachment: fixed;
color: #fff;
font-family: sans-serif;
font-size: 2em;
text-align: center;
}
canvas {
border: solid 2px #fff;
background-color: #000;
}
.container {
display: flex;
justify-content: center;
align-items: center;
margin-top: 20px;
}
.info {
margin-left: 20px;
text-align: left;
}
</style>
</head>
<body>
<div>TETRIS</div>
<div class="container">
<canvas id="tetris" width="240" height="400"></canvas>
<div class="info">
<div id="score">SCORE: 0</div>
<div class="controls">
<div class="info">
<div id="score">SCORE: 0</div>
<div class="controls">
<h3>操作方法</h3>
<p>← → 左右移動</p>
<p>↓ 下に落とす</p>
<p>Q 左回転</p>
<p>W 右回転</p>
<p>P 一時停止 (PAUSE)</p>
</div>
</div>
</div>
<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
context.scale(20, 20);

let gameOver = false; // ゲームオーバー状態を管理するフラグを追加
let isPaused = false; // ポーズ状態を管理するフラグ

// ライン消去時のスコア加算（1ライン1000点に変更）
function arenaSweep() {
let clearedLines = 0;
outer: for (let y = arena.length - 1; y > 0; --y) {
for (let x = 0; x < arena[y].length; ++x) {
if (arena[y][x] === 0) {
continue outer;
}
}
const row = arena.splice(y, 1)[0].fill(0);
arena.unshift(row);
++y;
clearedLines++; // 消したライン数をカウント
}

// 1ライン1000点に変更、複数ラインは倍率を適用
if (clearedLines === 1) player.score += 1000;
else if (clearedLines === 2) player.score += 3000;
else if (clearedLines === 3) player.score += 6000;
else if (clearedLines === 4) player.score += 10000;
}

// 衝突判定
function collide(arena, player) {
const [m, o] = [player.matrix, player.pos];
for (let y = 0; y < m.length; ++y) {
for (let x = 0; x < m[y].length; ++x) {
if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
return true;
}
}
}
return false;
}

// マトリックス（盤面やブロック）の作成
function createMatrix(w, h) {
const matrix = [];
while (h--) {
matrix.push(new Array(w).fill(0));
}
return matrix;
}

// テトリミノ（ブロック）の形状定義
function createPiece(type) {
    if (type === 'I') {
        return [
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
        ];
    } else if (type === 'L') {
        return [
            [0, 2, 0],
            [0, 2, 0],
            [0, 2, 2],
        ];
    } else if (type === 'J') {
        return [
            [0, 3, 0],
            [0, 3, 0],
            [3, 3, 0],
        ];
    } else if (type === 'O') {
        return [
            [4, 4],
            [4, 4],
        ];
    } else if (type === 'Z') {
        return [
            [5, 5, 0],
            [0, 5, 5],
            [0, 0, 0],
        ];
    } else if (type === 'S') {
        return [
            [0, 6, 6],
            [6, 6, 0],
            [0, 0, 0],
        ];
    } else if (type === 'T') {
        return [
            [0, 7, 0],
            [7, 7, 7],
            [0, 0, 0],
        ];
    }
}

// 描画処理
function draw() {
context.fillStyle = '#000';
context.fillRect(0, 0, canvas.width, canvas.height);
drawMatrix(arena, {x: 0, y: 0});
drawMatrix(player.matrix, player.pos);

// ポーズ画面表示
if (isPaused && !gameOver) {
context.fillStyle = 'rgba(0, 0, 0, 0.5)';
context.fillRect(0, 0, canvas.width, canvas.height);
context.fillStyle = '#ffeb3b';
context.font = '1px sans-serif';
context.textAlign = 'center';
context.fillText('PAUSE', arena[0].length / 2, arena.length / 2);
}

// ゲームオーバー画面表示を追加
if (gameOver) {
context.fillStyle = 'rgba(0, 0, 0, 0.75)';
context.fillRect(0, 0, canvas.width, canvas.height);
context.fillStyle = '#ff3333';
context.font = '1px sans-serif';
context.textAlign = 'center';
context.fillText('GAME OVER', arena[0].length / 2, arena.length / 2);

// リスタート案内を追加
context.fillStyle = '#ffffff';
context.font = '0.5px sans-serif';
context.textAlign = 'center';
context.fillText('PRESS SPACE TO RESTART', arena[0].length / 2, arena.length / 2 + 1);
}
} // 

const colors = [
null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF',
];

function drawMatrix(matrix, offset) {
matrix.forEach((row, y) => {
row.forEach((value, x) => {
if (value !== 0) {
context.fillStyle = colors[value];
context.fillRect(x + offset.x, y + offset.y, 1, 1);
}
});
});
}

// 盤面とブロックの合体
function merge(arena, player) {
player.matrix.forEach((row, y) => {
row.forEach((value, x) => {
if (value !== 0) {
arena[y + player.pos.y][x + player.pos.x] = value;
}
});
});
}

// ブロックの自由落下処理
function playerDrop() {
if (gameOver || isPaused) return; // ゲームオーバー・ポーズ時は動かさない
player.pos.y++;
if (collide(arena, player)) {
player.pos.y--;
merge(arena, player);
playerReset();
arenaSweep();
updateScore();
}
dropCounter = 0;
}

// ブロックの左右移動
function playerMove(offset) {
if (gameOver || isPaused) return; // ゲームオーバー・ポーズ時は動かさない
player.pos.x += offset;
if (collide(arena, player)) {
player.pos.x -= offset;
}
}

// 次のブロックの生成とゲームオーバー判定
function playerReset() {
const pieces = 'TJLOSZI';
player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
player.pos.y = 0;
player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

// 新しいブロックが生成された時点で衝突している場合はゲームオーバー
if (collide(arena, player)) {
gameOver = true;
}
}

// ブロックの回転処理
function playerRotate(dir) {
if (gameOver || isPaused) return; // ゲームオーバー・ポーズ時は動かさない
const pos = player.pos.x;
let offset = 1;
rotate(player.matrix, dir);
while (collide(arena, player)) {
player.pos.x += offset;
offset = -(offset + (offset > 0 ? 1 : -1));
if (offset > player.matrix[0].length) {
rotate(player.matrix, -dir);
player.pos.x = pos;
return;
}
}
}

// ゲームリスタート処理を追加
function gameRestart() {
    arena.forEach(row => row.fill(0)); // 盤面を真っ黒（空）に戻す
    player.score = 0;                  // スコアを0にする
    gameOver = false;                  // ゲームオーバー状態を解除
　  isPaused = false;                  // ポーズ状態も解除
    updateScore();                     // スコア表示を更新
    playerReset();                     // 新しいブロックを上から落とす
}

function rotate(matrix, dir) {
for (let y = 0; y < matrix.length; ++y) {
for (let x = 0; x < y; ++x) {
[
matrix[x][y],
matrix[y][x],
] = [
matrix[y][x],
matrix[x][y],
];
}
}
if (dir > 0) {
matrix.forEach(row => row.reverse());
} else {
matrix.reverse();
}
}

// --- 【速度変更のための設定】 ---
const INITIAL_SPEED = 1000; // 初期速度 (1秒 = 1000ms)
const MIN_SPEED = 500;      // 最高速度の限界 (0.1秒 = 500ms)
let dropCounter = 0;
let lastTime = 0;

function update(time = 0) {
    const deltaTime = time - lastTime;
    lastTime = time;

    // ゲームオーバーでなく、かつポーズ中でない時だけ時間を進める
    if (!gameOver && !isPaused) {
        // 5000点ごとに50msずつ落下間隔を短くする（限界値500msまで）
        let speedDecrease = Math.floor(player.score / 5000) * 50; 
        let dropInterval = Math.max(MIN_SPEED, INITIAL_SPEED - speedDecrease);

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }
    }

draw();
requestAnimationFrame(update);
}

function updateScore() {
// 元のコードにあった両方のスコア表示を更新
const scoreElements = document.querySelectorAll('#score');
scoreElements.forEach(el => {
el.innerText = 'SCORE: ' + player.score;
});
}

document.addEventListener('keydown', event => {
 // 上(38)と下(40)の矢印キーが押された際、ブラウザの画面スクロールを防止
    if (event.keyCode === 38 || event.keyCode === 40) {
        event.preventDefault();
    }

// Pキー（キーコード 80）が押されたらポーズを切り替え（ゲームオーバー時は無効）
if (event.keyCode === 80 && !gameOver) {
isPaused = !isPaused;
return;
}
// ゲームオーバー時にスペースキー（キーコード 32）が押されたらリスタート
if (gameOver) {
if (event.keyCode === 32) {
gameRestart();
}
return;
}

// ポーズ中は他のキー入力を受け付けない
if (isPaused) return;

if (event.keyCode === 37) {
playerMove(-1); // 左矢印
} else if (event.keyCode === 39) {
playerMove(1); // 右矢印
} else if (event.keyCode === 40) {
playerDrop(); // 下矢印
} else if (event.keyCode === 81) {
playerRotate(-1); // Qキーで左回転
} else if (event.keyCode === 87) {
playerRotate(1); // Wキーで右回転
}
});

const arena = createMatrix(12, 20);
const player = {
pos: {x: 0, y: 0},
matrix: null,
score: 0,
};

playerReset();
updateScore();
update();
</script>
</body>
</html>
